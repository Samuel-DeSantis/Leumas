[project]
name = "pvplatform"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "django>=5.1,<5.2",
    "django-htmx>=1.27.0",
    "django-ninja>=1.6.2",
    "psycopg[binary]>=3.3.4",
    "python-decouple>=3.8",
    "redis>=8.0.1",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.6",
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["apps", "pv_engine"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "pv_engine", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations"]
ignore_missing_imports = true
check_untyped_defs = true

# Django's class-based views rely on cooperative multiple inheritance
# (mixins that assume attributes/methods provided by whichever sibling
# View subclass they're combined with, e.g. self.object, self.fields,
# self.request, super().get_context_data()). This is a well-known
# django-stubs limitation, not a real bug in this codebase: the mixins
# are exercised directly by the test suite (apps/*/tests/test_views.py).
# Models, services, forms, and pv_engine -- the layers where static
# typing actually catches real mistakes -- stay under full strict checks.
[[tool.mypy.overrides]]
module = [
    "apps.*.views",
    "apps.*.mixins",
    "apps.*.permissions",
    "apps.core.views",
    "apps.core.forms",
]
disable_error_code = ["attr-defined", "misc", "union-attr"]

[tool.django-stubs]
django_settings_module = "config.settings"

