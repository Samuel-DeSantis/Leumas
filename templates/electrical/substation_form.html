{% extends "base.html" %}
{% block title %}New substation{% endblock %}
{% block content %}
<div class="max-w-lg">
  <h1 class="font-display text-2xl font-semibold text-pvink mb-6">New substation &middot; {{ site.name }}</h1>
  <form method="post">
    {% csrf_token %}
    {% include "partials/form_fields.html" with form=form %}
    <button type="submit" class="mt-6 rounded-md bg-pvblue px-4 py-2.5 text-sm font-medium text-white hover:bg-[#16324A]">
      Save substation
    </button>
  </form>
</div>
{% endblock %}
