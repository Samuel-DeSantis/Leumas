{% extends "base.html" %}
{% block title %}New organization{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16">
  <h1 class="font-display text-2xl font-semibold text-pvblue mb-1">New organization</h1>
  <p class="text-sm text-pvslate mb-8">You'll be the owner and can invite teammates afterward.</p>
  <form method="post">
    {% csrf_token %}
    {% include "partials/form_fields.html" with form=form %}
    <button type="submit" class="mt-6 w-full rounded-md bg-pvblue px-4 py-2.5 text-sm font-medium text-white hover:bg-[#16324A]">
      Create organization
    </button>
  </form>
</div>
{% endblock %}
