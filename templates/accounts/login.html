{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16">
  <h1 class="font-display text-2xl font-semibold text-pvblue mb-1">PV Engineering</h1>
  <p class="text-sm text-pvslate mb-8">Sign in to your account.</p>
  <form method="post">
    {% csrf_token %}
    {% include "partials/form_fields.html" with form=form %}
    <button type="submit" class="mt-6 w-full rounded-md bg-pvblue px-4 py-2.5 text-sm font-medium text-white hover:bg-[#16324A]">
      Sign in
    </button>
  </form>
  <p class="mt-6 text-sm text-pvslate">
    No account yet? <a href="{% url 'accounts:signup' %}" class="text-pvblue font-medium hover:underline">Create one</a>
  </p>
</div>
{% endblock %}
